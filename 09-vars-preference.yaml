- name: Variable preference
  hosts: local
  connection: local
  vars:
   course: "DevOps"
   trainer: "Rakesh from play"
  vars_files:
   - course.yaml
  vars_prompt:
   - name: course
     prompt: Enter course name
     private: false
   - name: trainer
     prompt: Enter trainer name
     private: false
  tasks:
  - name: Print Variables
    vars: 
    course: "DevOps"
    trainer: "Rakesh from Task"
    ansible.builtin.debug:
     msg: "Course is {{ course }}; Trainer is {{ trainer }}"
    