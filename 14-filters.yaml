- name: Ansible Filters
  hosts: local
  connection: local
  vars:
   topics: linux, shell, ansible, terraform
   COURSE: "DAWS with Anisble"
   myIP: 255.195.225.220
   tagsMap: 
     course: "Devops"
     duration: "6 months"
     hours: "200hrs"
   tagsList: [
        {
            "key": "course",
            "value": "Devops"
        },
        {
            "key": "duration",
            "value": "6 months"
        },
        {
            "key": "hours",
            "value": "200hrs"
        }
    ]
  tasks: 
  - name: Printing default value
    ansible.builtin.debug:
     msg: "Hello Rakesh, {{ GREETINGS | default('Good morning') }}"

  - name: Splitting a Variable
    ansible.builtin.debug:
     msg: "{{ topics | split(',') }}"

  - name: Converting map to list
    ansible.builtin.debug:
     msg: "{{ tagsMap | dict2items }}"
  
  - name: Converting list to map
    ansible.builtin.debug:
     msg: "{{ tagsList | items2dict }}"
  
  - name: Yaml file into a Variable
    ansible.builtin.set_fact:
     students_yaml: "{{ lookup('file', 'students.yaml') | from_yaml }}"
  
  - name: Converting yaml to JSON
    ansible.builtin.debug:
     msg: "{{ students_yaml | to_nice_json }}"

  - name: To UpperCase
    ansible.builtin.debug:
     msg: "{{ COURSE | upper }}"

  - name: To LowerCase
    ansible.builtin.debug:
     msg: "{{ COURSE | lower }}"
  
  - name: check IP
    ansible.builtin.debug:
     msg: "{{ myIP | ansible.utils.ipv4 }}"