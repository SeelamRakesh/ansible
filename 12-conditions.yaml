- name: Checking RedHat with Conditions
  hosts: local
  connection: local
  tasks:
  - name: Checking AMI
    ansible.builtin.debug:
     msg: "{{ ansible_facts }}"
  
  - name: Check RedHat or not
    ansible.builtin.debug:
     msg: "Yes package manager is RedHat"
    when: "{{ ansible_facts.os_family == RedHat }}"