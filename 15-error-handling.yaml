- name: Creating user
  hosts: local
  connection: local
  become: yes
  tasks:
  - name: Check user
    ansible.builtin.command: id roboshop
    register: user_output
    ignore_errors: true
  
  - name: Print output
    ansible.builtin.debug:
     msg: "{{ user_output }}"

  - name: Creating user in server
    ansible.builtin.command: useradd roboshop
    when: user_output.rc != 0